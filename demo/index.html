<!DOCTYPE html>
<html>
<head>
    <title>DNS Resolution Test</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        div { margin: 20px 0; }
        .fail { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <div id="status">Testing...</div>
    <img id="testImg" src="https://libraryapps.american.edu/resources/images/lib_logo.png" style="max-width: 300px; border: 1px solid #ccc; margin: 20px 0;">
    <div id="result"></div>

    <script>
        const statusDiv = document.getElementById('status');
        const resultDiv = document.getElementById('result');
        const imgElement = document.getElementById('testImg');
        
        imgElement.onload = () => {
            statusDiv.textContent = '✓ Image loaded successfully';
            statusDiv.className = 'success';
        };
        
        imgElement.onerror = () => {
            statusDiv.textContent = '✗ Image failed to load';
            statusDiv.className = 'fail';
            resultDiv.textContent = 'If on-campus with local network disabled in Chrome: CLNR is blocking the local IP resolution';
        };
    </script>
</body>
</html>
